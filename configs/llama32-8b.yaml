# Optional 8B QLoRA path — same SFT script as configs/default.yaml.
# Llama 3.2 has no official 8B checkpoint; this file uses Llama-3.1-8B-Instruct.
# Tuned for a single Kaggle T4 (~16 GB): batch 1 + higher grad-accum keeps the
# effective batch at 8 while staying in 4-bit VRAM.
#
#   python scripts/train_sft.py --config configs/llama32-8b.yaml
#   python scripts/train_sft.py --config configs/llama32-8b.yaml --run --max-steps 20
#
# Equivalent override on the 3B YAML (not recommended for 8B VRAM):
#   python scripts/train_sft.py --model-name unsloth/Meta-Llama-3.1-8B-Instruct
model:
  name: "unsloth/Meta-Llama-3.1-8B-Instruct"
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  num_train_epochs: 1
  warmup_steps: 10
  logging_steps: 10
  save_steps: 50
  max_steps: null          # set e.g. 20 for a Kaggle smoke train
  optim: "adamw_8bit"
  seed: 3407
  output_dir: "outputs"
  adapter_dir: "outputs/adapters/llama31-8b-ecra-sft"
  dataset_dir: "data/processed/ecra-sft-v0.1.0"
  packing: false

inference:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  system_prompt: >-
    You are a financial research assistant. Answer clearly and conservatively.
    If the question cannot be answered from the provided context, say so.
    Do not invent numbers.
