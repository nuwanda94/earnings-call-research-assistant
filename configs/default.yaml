# Default training / inference config – Phase 0/2 (primary 3B path).
# Optional 8B T4 path: configs/llama32-8b.yaml or --model-name on train_sft.py.
#
# Effective batch size = per_device_train_batch_size × gradient_accumulation_steps
#                      × (data-parallel GPUs, usually 1 on Kaggle)
# T4 4-bit 3B: micro-batch 2 is comfortable; accum 8 → effective 16 (stable SFT).
# If you OOM, drop micro-batch to 1 and raise accum to keep the same effective size.
model:
  name: "unsloth/Llama-3.2-3B-Instruct"  # or Qwen2.5-3B-Instruct / Llama-3.1-8B
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # effective batch = 2 × 8 = 16
  learning_rate: 2.0e-4
  num_train_epochs: 1
  warmup_steps: 10
  logging_steps: 10
  save_steps: 50
  max_steps: null          # set e.g. 20 for a Kaggle smoke train
  max_grad_norm: 1.0
  optim: "adamw_8bit"
  seed: 3407
  output_dir: "outputs"
  adapter_dir: "outputs/adapters/llama32-3b-ecra-sft"
  dataset_dir: "data/processed/ecra-sft-v0.1.0"
  packing: false

inference:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  system_prompt: >-
    You are a financial research assistant. Answer clearly and conservatively.
    If the question cannot be answered from the provided context, say so.
    Do not invent numbers.
