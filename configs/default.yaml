# Default training / inference config – Phase 0/2
model:
  name: "unsloth/Llama-3.2-3B-Instruct"  # or Qwen2.5-3B-Instruct / 8B variants
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  num_train_epochs: 1
  warmup_steps: 10
  logging_steps: 10
  optim: "adamw_8bit"
  seed: 3407
  output_dir: "outputs"

inference:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  system_prompt: >-
    You are a financial research assistant. Answer clearly and conservatively.
    If the question cannot be answered from the provided context, say so.
    Do not invent numbers.
